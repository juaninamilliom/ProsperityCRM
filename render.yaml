# Render Blueprint — provisions the Prosperity CRM API and its Postgres database.
# Deploy: push to main, then in the Render dashboard choose
#   New → Blueprint → point at this repo. Render reads this file.
#
# After the first deploy you must set CORS_ORIGINS to your Vercel URL
# (it is marked sync:false below because it is not known until the web app ships).

databases:
  - name: prosperity-db
    databaseName: prosperity_crm
    user: prosperity
    plan: free

services:
  - type: web
    name: prosperity-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    # Root install is required: this is an npm-workspaces monorepo.
    # Migrations are idempotent, so running them on each deploy is safe.
    buildCommand: npm install && npm run build --workspace @prosperity/api && npm run migrate
    startCommand: npm run start --workspace @prosperity/api
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DATABASE_URL
        fromDatabase:
          name: prosperity-db
          property: connectionString
      - key: PG_SSL
        value: "true"
      - key: PG_POOL_MAX
        value: "10"
      # Generated once by Render and held constant across deploys.
      - key: ROOT_ADMIN_TOKEN
        generateValue: true
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      # Set this in the dashboard to your Vercel origin, e.g.
      #   https://prosperity-crm.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Where sign-in links point. Defaults to the first CORS_ORIGINS entry;
      # set it explicitly if the app is served from a different host.
      - key: APP_BASE_URL
        sync: false
      # Number of trusted proxies in front. Rate limiting stays OFF until this
      # is set. Measure the raw X-Forwarded-For on one real request first -
      # guessing it either protects nobody or locks everybody out.
      - key: TRUSTED_PROXY_HOPS
        sync: false
